name: Update All WhaleRadar Financial Data

on:
  schedule:
    # Runs every 30 minutes Monday through Friday during US market activity (12:00 UTC to 23:00 UTC)
    - cron: '*/30 12-23 * * 1-5'
    # Runs every 2 hours on weekends / outside market hours
    - cron: '0 */2 * * 0,6'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Aggregate All 3 Data Sources
        run: |
          python scripts/sync_all_data.py

      - name: Commit and Push Updated Data & Logs
        run: |
          git config user.name "WhaleRadar Bot"
          git config user.email "datawhaleradar@proton.me"
          git add data/ logs/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): auto-update primary financial data and logs [skip ci]"
            git push
          fi
